<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vessel of Stolen Streams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Almendra:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080608; --surface: #0e0b0f; --border: #2a1a2e;
      --accent: #8b0000; --accent-bright: #c0392b; --glow: #8b000066;
      --text: #d4c5b0; --muted: #6b5b4e; --success: #2d6a4f; --success-bright: #40916c;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Almendra', serif; font-size: 1.1rem; }
    #root { min-height: 100vh; }
    .app {
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 0%, #1a0a1a 0%, #080608 50%),
                  radial-gradient(ellipse at 80% 100%, #1a0505 0%, transparent 50%);
      padding: 2rem 1rem 4rem; position: relative; overflow: hidden;
    }
    .app::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 40px, #ffffff03 40px, #ffffff03 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, #ffffff02 40px, #ffffff02 41px);
      pointer-events: none; z-index: 0;
    }
    .container { max-width: 680px; margin: 0 auto; position: relative; z-index: 1; }
    .header { text-align: center; margin-bottom: 2rem; }
    .sigil { font-size: 2.2rem; margin-bottom: 0.5rem; filter: drop-shadow(0 0 12px #8b000088); animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
    h1 { font-family: 'Metamorphous', cursive; font-size: clamp(1.4rem, 5vw, 2.1rem); color: #c0392b; text-shadow: 0 0 20px #8b000066, 0 0 40px #8b000033; letter-spacing: 0.04em; line-height: 1.3; }
    .subtitle { color: var(--muted); font-style: italic; font-size: 1.05rem; margin-top: 0.4rem; }
    .tabs { display: flex; margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .tab { flex: 1; padding: 0.75rem 0.3rem; background: var(--surface); color: var(--muted); border: none; cursor: pointer; font-family: 'Metamorphous', cursive; font-size: 0.65rem; letter-spacing: 0.05em; text-transform: uppercase; transition: all 0.2s; border-right: 1px solid var(--border); }
    .tab:last-child { border-right: none; }
    .tab:hover { color: var(--text); background: #12090f; }
    .tab.active { background: #1a0810; color: var(--accent-bright); box-shadow: inset 0 -2px 0 var(--accent); }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1.2rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.4rem; font-family: 'Metamorphous', cursive; }
    input, select { width: 100%; background: #0a060c; border: 1px solid var(--border); color: var(--text); padding: 0.75rem 0.9rem; font-family: 'Almendra', serif; font-size: 1.05rem; border-radius: 3px; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    input::placeholder { color: var(--muted); font-style: italic; }
    select option { background: #0a060c; }
    .btn { width: 100%; padding: 0.85rem; background: #1a0508; border: 1px solid var(--accent); color: var(--accent-bright); font-family: 'Metamorphous', cursive; font-size: 0.82rem; letter-spacing: 0.08em; cursor: pointer; border-radius: 3px; transition: all 0.2s; position: relative; overflow: hidden; }
    .btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 40%, #8b000022 100%); pointer-events: none; }
    .btn:hover:not(:disabled) { background: #2a0810; box-shadow: 0 0 20px var(--glow); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.secondary { background: #0a0a0e; border-color: var(--border); color: var(--muted); }
    .btn.secondary:hover:not(:disabled) { border-color: #4a3a5a; color: var(--text); box-shadow: none; }
    .btn.success { background: #0a1a10; border-color: var(--success); color: var(--success-bright); }
    .btn.sm { padding: 0.75rem 1rem; font-size: 0.72rem; width: auto; flex-shrink: 0; }
    .inline-row { display: flex; gap: 0.5rem; align-items: flex-end; }
    .inline-row input { flex: 1; }
    .results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin-top: 1rem; }
    .result-card { background: #0a060c; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s; }
    .result-card:hover { border-color: #4a2a3a; }
    .result-card.active { border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }
    .result-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .result-meta { padding: 0.4rem 0.5rem; }
    .result-title { font-size: 0.78rem; color: var(--text); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .result-channel { font-size: 0.68rem; color: var(--muted); margin-top: 0.2rem; font-style: italic; }
    .player-section { margin-top: 1.2rem; }
    .player-title { font-family: 'Metamorphous', cursive; font-size: 0.88rem; color: var(--text); margin-bottom: 0.6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-wrap { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 3px; background: #000; border: 1px solid var(--border); }
    .player-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .player-controls { display: flex; gap: 0.5rem; margin-top: 0.6rem; align-items: center; }
    .nav-btn { background: #0a060c; border: 1px solid var(--border); color: var(--muted); padding: 0.6rem 0.9rem; font-size: 1rem; cursor: pointer; border-radius: 3px; transition: all 0.2s; flex-shrink: 0; }
    .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-bright); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .quality-inline { background: #0a060c; border: 1px solid var(--border); color: var(--muted); padding: 0.6rem 0.5rem; font-family: 'Almendra', serif; font-size: 0.85rem; border-radius: 3px; outline: none; cursor: pointer; flex-shrink: 0; }
    .quality-inline option { background: #0a060c; }
    .dl-result { margin-top: 0.8rem; padding: 0.8rem; background: #0a0a0e; border: 1px solid #1a2a1a; border-radius: 3px; animation: fadeIn 0.3s ease; }
    .dl-result.error { border-color: #3a1a1a; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    .result-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 0.5rem; }
    .dl-link { color: var(--success-bright); word-break: break-all; font-size: 0.95rem; }
    .dl-link a { color: inherit; }
    .error-msg { color: #c0392b; font-style: italic; font-size: 0.9rem; }
    .picker-grid { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.4rem; }
    .picker-item { padding: 0.5rem 0.7rem; background: #0d0b10; border: 1px solid var(--border); border-radius: 3px; display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; }
    .picker-item a { color: var(--success-bright); text-decoration: none; font-size: 0.78rem; padding: 0.15rem 0.5rem; border: 1px solid var(--success); border-radius: 2px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
    .note { font-style: italic; color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; }
    .hint { font-size: 0.8rem; color: var(--muted); font-style: italic; margin-top: 0.3rem; line-height: 1.4; }
    .supported { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
    .tag { padding: 0.15rem 0.5rem; background: #100a14; border: 1px solid #2a1a3a; border-radius: 2px; font-size: 0.72rem; color: var(--muted); }
    .empty-state { text-align: center; color: var(--muted); font-style: italic; padding: 2rem 0; font-size: 0.95rem; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #8b000044; border-top-color: var(--accent-bright); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 0.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gh-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    @media (max-width: 480px) { .gh-row { grid-template-columns: 1fr; } }
    .status-badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 2px; font-size: 0.75rem; margin-top: 0.8rem; }
    .status-badge.ok { background: #0a1a10; color: var(--success-bright); border: 1px solid var(--success); }
    .status-badge.err { background: #1a0508; color: var(--accent-bright); border: 1px solid var(--accent); }
    .copy-row { display: flex; gap: 0.6rem; }
    .copy-row .btn { flex: 1; }
    .code-block { background: #06040a; border: 1px solid var(--border); border-radius: 3px; padding: 1rem; font-family: 'Courier New', monospace; font-size: 0.75rem; color: #a0906a; max-height: 220px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.5; margin: 0.8rem 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    async function cobaltFetch(url, quality) {
      const r = await fetch("https://api.cobalt.tools/", {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify({ url, videoQuality: quality, filenameStyle: "basic" })
      });
      return r.json();
    }

    function DlResult({ res }) {
      if (!res) return null;
      if (res.status === "error") return (
        <div className="dl-result error">
          <span className="error-msg">⚠ {res.error?.code || res.error || "Unknown error"}</span>
        </div>
      );
      if (res.status === "tunnel" || res.status === "redirect") return (
        <div className="dl-result">
          <div className="result-label">Download Ready</div>
          <div className="dl-link"><a href={res.url} target="_blank" rel="noreferrer">⬇ {res.filename || "Download file"}</a></div>
        </div>
      );
      if (res.status === "picker") return (
        <div className="dl-result">
          <div className="result-label">Multiple streams</div>
          <div className="picker-grid">
            {res.picker.map((p, i) => (
              <div className="picker-item" key={i}>
                <span>{p.type}{p.quality ? ` · ${p.quality}` : ""}</span>
                <a href={p.url} target="_blank" rel="noreferrer">Download</a>
              </div>
            ))}
          </div>
        </div>
      );
      return null;
    }

    function App() {
      const [tab, setTab] = useState("search");

      // Search & play
      const [query, setQuery] = useState("");
      const [results, setResults] = useState([]);
      const [searching, setSearching] = useState(false);
      const [searchErr, setSearchErr] = useState(null);
      const [activeIdx, setActiveIdx] = useState(null);
      const [dlResult, setDlResult] = useState(null);
      const [dlLoading, setDlLoading] = useState(false);
      const [playerQuality, setPlayerQuality] = useState("1080");

      // Direct download
      const [dlUrl, setDlUrl] = useState("");
      const [quality, setQuality] = useState("1080");
      const [tabDlLoading, setTabDlLoading] = useState(false);
      const [tabDlResult, setTabDlResult] = useState(null);

      // GitHub
      const [ghToken, setGhToken] = useState("");
      const [ghRepo, setGhRepo] = useState("");
      const [ghPath, setGhPath] = useState("downloader.html");
      const [ghStatus, setGhStatus] = useState(null);
      const [ghLoading, setGhLoading] = useState(false);
      const [copied, setCopied] = useState(false);

      const activeVideo = activeIdx !== null ? results[activeIdx] : null;

      async function doSearch() {
        if (!query.trim()) return;
        setSearching(true); setSearchErr(null); setResults([]); setActiveIdx(null); setDlResult(null);
        try {
          const r = await fetch(`/api/search?q=${encodeURIComponent(query.trim())}`);
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Search failed");
          if (!Array.isArray(data) || data.length === 0) throw new Error("No results found");
          setResults(data);
        } catch (e) { setSearchErr(e.message); }
        setSearching(false);
      }

      async function downloadActive() {
        if (!activeVideo) return;
        setDlLoading(true); setDlResult(null);
        try {
          const d = await cobaltFetch(`https://www.youtube.com/watch?v=${activeVideo.id}`, playerQuality);
          setDlResult(d);
        } catch (e) { setDlResult({ status: "error", error: { code: e.message } }); }
        setDlLoading(false);
      }

      async function doDirectDownload() {
        if (!dlUrl.trim()) return;
        setTabDlLoading(true); setTabDlResult(null);
        try {
          const d = await cobaltFetch(dlUrl.trim(), quality);
          setTabDlResult(d);
        } catch (e) { setTabDlResult({ status: "error", error: { code: e.message } }); }
        setTabDlLoading(false);
      }

      async function commitToGitHub() {
        if (!ghToken || !ghRepo || !ghPath) return;
        setGhLoading(true); setGhStatus(null);
        const parts = ghRepo.split("/");
        if (parts.length !== 2 || !parts[0] || !parts[1]) {
          setGhStatus({ ok: false, msg: "Repo must be in owner/repo format" });
          setGhLoading(false); return;
        }
        const [owner, repo] = parts;
        const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents/${ghPath}`;
        const headers = { Authorization: `token ${ghToken}`, "Content-Type": "application/json" };
        const snippet = `<div style="font-family:'Georgia',serif;background:#0e0b0f;border:1px solid #2a1a2e;border-radius:4px;padding:1.2rem;max-width:520px;margin:1rem auto;"><div style="color:#c0392b;font-weight:bold;margin-bottom:0.8rem;">⬇ Video Downloader</div><input id="vd-u" type="text" placeholder="Paste video URL..." style="width:100%;background:#06040a;border:1px solid #2a1a2e;color:#d4c5b0;padding:0.6rem;border-radius:3px;outline:none;margin-bottom:0.6rem;font-size:0.95rem;" /><button onclick="vdF()" style="width:100%;padding:0.65rem;background:#1a0508;border:1px solid #8b0000;color:#c0392b;cursor:pointer;border-radius:3px;">SUMMON LINK</button><div id="vd-o" style="margin-top:0.8rem;display:none;"></div></div><script>async function vdF(){var u=document.getElementById('vd-u').value.trim(),o=document.getElementById('vd-o');if(!u)return;o.style.display='none';try{var r=await fetch('https://api.cobalt.tools/',{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify({url:u,filenameStyle:'basic'})});var d=await r.json();if(d.status==='error')o.innerHTML='<span style="color:#c0392b;">'+d.error?.code+'</span>';else if(d.status==='picker')o.innerHTML=d.picker.map((p,i)=>'<a href="'+p.url+'" target="_blank" style="display:block;color:#40916c;">['+p.type+' '+(i+1)+'] Download</a>').join('');else o.innerHTML='<a href="'+d.url+'" target="_blank" style="color:#40916c;">⬇ '+(d.filename||'Download')+'</a>';o.style.display='block';}catch(e){o.innerHTML='<span style="color:#c0392b;">'+e.message+'</span>';o.style.display='block';}}<\/script>`;
        const fullHTML = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Downloader</title><style>body{background:#080608;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}</style></head><body>${snippet}</body></html>`;
        try {
          let sha;
          const check = await fetch(apiBase, { headers });
          if (check.ok) { const cd = await check.json(); sha = cd.sha; }
          const body = { message: "Add video downloader", content: btoa(Array.from(new TextEncoder().encode(fullHTML), b => String.fromCharCode(b)).join("")) };
          if (sha) body.sha = sha;
          const res = await fetch(apiBase, { method: "PUT", headers, body: JSON.stringify(body) });
          const rd = await res.json();
          if (res.ok) setGhStatus({ ok: true, url: rd.content?.html_url });
          else setGhStatus({ ok: false, msg: rd.message });
        } catch (e) { setGhStatus({ ok: false, msg: e.message }); }
        setGhLoading(false);
      }

      function copyIframe() {
        const code = `<iframe src="${ghPath}" style="border:none;width:100%;height:220px;" title="Downloader"></iframe>`;
        navigator.clipboard.writeText(code).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); }).catch(() => {});
      }

      return (
        <div className="app">
          <div className="container">
            <div className="header">
              <div className="sigil">☽ ✦ ☾</div>
              <h1>Vessel of Stolen Streams</h1>
              <div className="subtitle">powered by the Cobalt oracle</div>
            </div>

            <div className="tabs">
              {[["search","🔍 Search"],["download","⬇ Direct"],["github","⬡ GitHub"]].map(([id, label]) => (
                <button key={id} className={`tab ${tab===id?"active":""}`} onClick={() => setTab(id)}>{label}</button>
              ))}
            </div>

            {/* SEARCH & PLAY */}
            {tab === "search" && (
              <div className="panel">
                <div className="field">
                  <label>Search YouTube</label>
                  <div className="inline-row">
                    <input
                      value={query}
                      onChange={e => setQuery(e.target.value)}
                      placeholder="Search for a video..."
                      onKeyDown={e => e.key === "Enter" && doSearch()}
                    />
                    <button className="btn sm" onClick={doSearch} disabled={searching || !query.trim()}>
                      {searching ? <span className="spinner" /> : "Search"}
                    </button>
                  </div>
                  <p className="hint">YouTube search runs through your Vercel server — API key stays private.</p>
                </div>

                {searchErr && <p className="error-msg" style={{marginBottom:"0.8rem"}}>⚠ {searchErr}</p>}

                {results.length === 0 && !searching && !searchErr && (
                  <div className="empty-state">Search results appear here. Tap a card to load the player.</div>
                )}

                {results.length > 0 && (
                  <div className="results-grid">
                    {results.map((v, i) => (
                      <div
                        key={v.id}
                        className={`result-card ${activeIdx === i ? "active" : ""}`}
                        onClick={() => { setActiveIdx(i); setDlResult(null); }}
                      >
                        <img src={v.thumb} alt={v.title} loading="lazy" />
                        <div className="result-meta">
                          <div className="result-title">{v.title}</div>
                          <div className="result-channel">{v.channel}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeVideo && (
                  <div className="player-section">
                    <hr className="divider" />
                    <div className="player-title">▶ {activeVideo.title}</div>
                    <div className="player-wrap">
                      <iframe
                        key={activeVideo.id}
                        src={`https://www.youtube.com/embed/${activeVideo.id}?autoplay=1&rel=0`}
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowFullScreen
                        title={activeVideo.title}
                      />
                    </div>
                    <div className="player-controls">
                      <button
                        className="nav-btn"
                        onClick={() => { setActiveIdx(idx => Math.max(0, idx - 1)); setDlResult(null); }}
                        disabled={activeIdx === 0}
                      >◀</button>
                      <select className="quality-inline" value={playerQuality} onChange={e => setPlayerQuality(e.target.value)}>
                        <option value="max">Max</option>
                        <option value="2160">4K</option>
                        <option value="1440">1440p</option>
                        <option value="1080">1080p</option>
                        <option value="720">720p</option>
                        <option value="480">480p</option>
                      </select>
                      <button className="btn" style={{flex:1}} onClick={downloadActive} disabled={dlLoading}>
                        {dlLoading ? <><span className="spinner"/>Getting link...</> : "⬇ Download"}
                      </button>
                      <button
                        className="nav-btn"
                        onClick={() => { setActiveIdx(idx => Math.min(results.length - 1, idx + 1)); setDlResult(null); }}
                        disabled={activeIdx >= results.length - 1}
                      >▶</button>
                    </div>
                    <DlResult res={dlResult} />
                  </div>
                )}
              </div>
            )}

            {/* DIRECT DOWNLOAD */}
            {tab === "download" && (
              <div className="panel">
                <div className="field">
                  <label>Video URL</label>
                  <input
                    value={dlUrl}
                    onChange={e => setDlUrl(e.target.value)}
                    placeholder="https://youtube.com/watch?v=..."
                    onKeyDown={e => e.key === "Enter" && doDirectDownload()}
                  />
                </div>
                <div className="field">
                  <label>Quality</label>
                  <select value={quality} onChange={e => setQuality(e.target.value)}>
                    <option value="max">Max Available</option>
                    <option value="2160">4K (2160p)</option>
                    <option value="1440">1440p</option>
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                    <option value="360">360p</option>
                    <option value="144">144p</option>
                  </select>
                </div>
                <button className="btn" onClick={doDirectDownload} disabled={tabDlLoading || !dlUrl.trim()}>
                  {tabDlLoading ? <><span className="spinner"/>Consulting the oracle...</> : "⬇ Summon Download Link"}
                </button>
                <DlResult res={tabDlResult} />
                <hr className="divider" />
                <div className="supported">
                  {["YouTube","TikTok","Twitter/X","Instagram","Reddit","Vimeo","SoundCloud","Twitch","Pinterest","Tumblr"].map(s => (
                    <span className="tag" key={s}>{s}</span>
                  ))}
                </div>
              </div>
            )}

            {/* GITHUB */}
            {tab === "github" && (
              <div className="panel">
                <p style={{color:"var(--text)",marginBottom:"1.2rem",fontSize:"0.95rem"}}>Commits a standalone downloader HTML file to your repo, then iframe it from your index.</p>
                <div className="field">
                  <label>GitHub Token</label>
                  <input type="password" value={ghToken} onChange={e => setGhToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx" />
                </div>
                <div className="gh-row">
                  <div className="field">
                    <label>Repo</label>
                    <input value={ghRepo} onChange={e => setGhRepo(e.target.value)} placeholder="owner/repo" />
                  </div>
                  <div className="field">
                    <label>File Path</label>
                    <input value={ghPath} onChange={e => setGhPath(e.target.value)} placeholder="downloader.html" />
                  </div>
                </div>
                <button className="btn" onClick={commitToGitHub} disabled={ghLoading || !ghToken || !ghRepo || !ghPath}>
                  {ghLoading ? <><span className="spinner"/>Committing...</> : "⬡ Commit to GitHub"}
                </button>
                {ghStatus && (
                  ghStatus.ok
                    ? <><span className="status-badge ok">✓ Committed</span>{ghStatus.url && <p className="note" style={{marginTop:"0.5rem"}}>→ <a href={ghStatus.url} target="_blank" rel="noreferrer" style={{color:"var(--success-bright)"}}>{ghStatus.url}</a></p>}</>
                    : <span className="status-badge err">✗ {ghStatus.msg}</span>
                )}
                <hr className="divider" />
                <p className="note">Then add this to your index.html where you want the downloader to appear:</p>
                <div className="code-block">{`<iframe src="${ghPath}" style="border:none;width:100%;height:220px;" title="Downloader"></iframe>`}</div>
                <div className="copy-row" style={{marginTop:"0.5rem"}}>
                  <button className={`btn ${copied ? "success" : "secondary"}`} onClick={copyIframe}>
                    {copied ? "✓ Copied!" : "Copy iframe code"}
                  </button>
                </div>
                <p className="note" style={{marginTop:"0.8rem"}}>Token needs <strong>repo</strong> scope. Repo format: <strong>owner/repo</strong></p>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
